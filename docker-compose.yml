services:
  # Pelias Elasticsearch for London data
  elasticsearch-pelias-london:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    container_name: pelias_elasticsearch_london
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_london_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pelias-network

  # Pelias Elasticsearch for UK data
  elasticsearch-pelias-uk:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    container_name: pelias_elasticsearch_uk
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9202:9200"
    volumes:
      - es_uk_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pelias-network

  # Pelias Elasticsearch for London data (baseline - no postcode enrichment)
  elasticsearch-pelias-london-baseline:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    container_name: pelias_elasticsearch_london_baseline
