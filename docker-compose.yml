      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pelias-network

  # Pelias Elasticsearch for UK data (with postcode estimation - prelookup mode)
  elasticsearch-pelias-uk-estimation-prelookup:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.8.23
    container_name: pelias_elasticsearch_uk_estimation_prelookup
